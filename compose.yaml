services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: mydatabase
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5433"
    command: postgres -p 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  migrations:
    image: ghcr.io/kukymbr/goose-docker:3.26.0
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=host=db port=5433 user=user password=password dbname=mydatabase
    volumes:
      - ./migrations:/migrations